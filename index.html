<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Pollo Resucitado</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">

    <header class="header">
      <h1 class="logo">San Pollo<br>Resucitado</h1>
    </header>

    <div class="subtitle-wrap">
      <p class="subtitle">Revisa nuestras opciones</p>
    </div>

    <main class="grid">

      <a class="card" href="#platos">
        <div class="thumb thumb-platos" role="img" aria-label="Platos"><img src="Imagenes/Platos.png" height: 200px; width: 150px;></div>
        <span class="card-label">Platos</span>
      </a>

      <a class="card" href="#cervezas">
        <div class="thumb thumb-cervezas" role="img" aria-label="Cervezas"><img src="Imagenes/Cervezas.png" height: 200px; width: 150px;></div>
        <span class="card-label">Cervezas</span>
      </a>

      <a class="card" href="#postres">
        <div class="thumb thumb-postres" role="img" aria-label="Postres"><img src="Imagenes/Postres.png" height: 200px; width: 150px;></div>
        <span class="card-label">Postres</span>
      </a>

      <a class="card" href="#bebidas">
        <div class="thumb thumb-bebidas" role="img" aria-label="Bebidas"><img src="Imagenes/Bebidas.png" height: 200px; width: 150px;></div>
        <span class="card-label">Bebidas</span>
      </a>

    </main>

    <footer class="footer">
      <button class="cart-btn" aria-label="Ver carrito">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26">
          <path fill="none" stroke="#8fc7d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" />
          <circle cx="9.5" cy="20.5" r="1.4" fill="#8fc7d9"/>
          <circle cx="17.5" cy="20.5" r="1.4" fill="#8fc7d9"/>
        </svg>
      </button>
    </footer>

  </div>
</body>
</html>
