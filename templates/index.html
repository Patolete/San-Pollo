{% extends "base.html" %}

{% block contenido %}

    <header class="header">
      <h1 class="logo">San Pollo<br>Resucitado</h1>
    </header>

    <div class="subtitle-wrap">
      <p class="subtitle">Revisa nuestras opciones</p>
    </div>

    <main class="grid">

      <a class="card" href="/platos">
        <div class="thumb thumb-platos" role="img" aria-label="Platos"><img src="{{ url_for('static', filename='Imagenes/platos.jpg') }}" height: 80px; width: 80px; class="imagin1"></div>
        <span class="card-label">Platos</span>
      </a>

      <a class="card" href="/cervezas">
        <div class="thumb thumb-cervezas" role="img" aria-label="Cervezas"><img src="{{ url_for('static', filename='Imagenes/cervezas.jpg') }}" height: 80px; width: 80px; class="imagin1"></div>
        <span class="card-label">Cervezas</span>
      </a>

      <a class="card" href="/postres">
        <div class="thumb thumb-postres" role="img" aria-label="Postres"><img src="{{ url_for('static', filename='Imagenes/postres.jpg') }}" height: 80px; width: 80px; class="imagin1"></div>
        <span class="card-label">Postres</span>
      </a>

      <a class="card" href="/bebidas">
        <div class="thumb thumb-bebidas" role="img" aria-label="Bebidas"><img src="{{ url_for('static', filename='Imagenes/bebidas.jpg') }}" height: 80px; width: 80px; class="imagin1"></div>
        <span class="card-label">Bebidas</span>
      </a>

    </main>




{% endblock %}
