<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Pollo Resucitado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="empli">
    {% for i in items %}
    <div class="card2">
        <div class="cosaspedid">
          <span class="numero">Pedido N°: {{ i.id }}</span>
          {% for prod in i['items'] %}
                    <span>{{ prod.cantidad }}x {{ prod.nombre }}</span>
          {% endfor %}
        </div>
          {%if i.estado == 'pendiente'%}
            <div class = "estados">
                <form action="/estado/{{ i.id }}" method="POST">
                    <input type="hidden" name="estado" value="en_preparacion">
                    <button type="submit" class="preparacion">En preparación</button>
                </form>
            </div>
        {%endif%}
        {%if i.estado == 'en_preparacion'%}
            <div class = "estados">
                <form action="/estado/{{ i.id }}" method="POST">
                    <input type="hidden" name="estado" value="listo">
                    <button type="submit">Listo</button>
                </form>
            </div>
        {%endif%}
        {%if i.estado == 'listo'%}
            <div class = "estados">
                <form action="/estado/{{ i.id }}" method="POST">
                    <input type="hidden" name="estado" value="entregado">
                    <button type="submit">Entregado</button>
                </form>
            </div>
        {%endif%}    
    </div>
    {% endfor %}
  </div>
  </body>
<footer>
</footer>
</html>
