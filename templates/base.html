<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Pollo Resucitado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="frame">

    {% block contenido %}
    {% endblock %}

    <footer class="footer">
      <a class="back-btn" aria-label="Volver" href="/">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26">
        <path
          d="M15 18l-6-6 6-6"
            fill="none"
            stroke="#8fc7d9"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="cart-btn" aria-label="Ver carrito" href="/carrito"> 
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26">
          <path fill="none" stroke="#8fc7d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
            d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6" />
          <circle cx="9.5" cy="20.5" r="1.4" fill="#8fc7d9"/>
          <circle cx="17.5" cy="20.5" r="1.4" fill="#8fc7d9"/>
        </svg>
      </a>
    </footer>

  </div>
</body>
</html>
