{% extends "base.html" %}

{% block contenido %}
<header class="header">
  <h1 class="logo">Cervezas</h1>
</header>

<main class="lista-productos">
  {% for c in cervezas %}
    <div class="card">
      <img src="{{ url_for('static', filename=c.imagen or 'placeholder.png') }}" alt="{{ c.nombre }}">
      <span class="producto-nombre">{{ c.nombre }}</span>
      <span class="producto-precio">${{ c.precio }}</span>
    </div>
  {% endfor %}
</main>
{% endblock %}
