{% extends "base.html" %}

{% block contenido %}
<header class="header">
  <h1 class="logo">Cervezas</h1>
</header>

<main class="grid">
  {% for c in cervezas %}
    <div class="card">
      <img src="{{ url_for('static', filename=c.imagen or 'placeholder.png') }}" alt="">
      <span class="producto-nombre">{{ c.nombre }}</span>
      <span class="producto-precio">${{ c.precio }}</span>

      <form action="/agregar/{{ c.id }}" method="POST">
        <input type="number" name="cantidad" value="1" min="1" class="numerin">
        <button type="submit" class="agr-btn">Agregar</button>
      </form>
    </div>
  {% endfor %}
</main>
{% endblock %}
